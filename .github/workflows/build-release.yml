name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.3)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (integer)'
        required: false
        default: '1'

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            NAME="${TAG#v}"
            CODE=$(echo "$NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            NAME="${{ github.event.inputs.version_name }}"
            CODE="${{ github.event.inputs.version_code }}"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            > /dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;30.0.3" \
            "platforms;android-34"

      - name: Generate signing keystore
        id: signing
        run: |
          KS_PASS=$(openssl rand -hex 20)
          KEY_PASS=$(openssl rand -hex 20)
          ALIAS="wexow"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair \
            -keystore client/keystore.jks \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -alias "$ALIAS" \
            -dname "CN=Wexow, OU=Dev, O=Wexow, L=Unknown, ST=Unknown, C=US" \
            -storepass "$KS_PASS" \
            -keypass  "$KEY_PASS" \
            -storetype JKS \
            -v
          echo "ks_path=${{ github.workspace }}/client/keystore.jks" >> $GITHUB_OUTPUT
          echo "ks_pass=$KS_PASS"   >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT
          echo "alias=$ALIAS"       >> $GITHUB_OUTPUT

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('client/**/*.gradle') }}
          restore-keys: |
            gradle-caches-

      - name: Create local.properties
        working-directory: client
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: client
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: client
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
        env:
          JAVA_HOME:         ${{ env.JAVA_HOME_11_X64 }}
          KEYSTORE_PATH:     ${{ steps.signing.outputs.ks_path }}
          KEYSTORE_PASSWORD: ${{ steps.signing.outputs.ks_pass }}
          KEY_ALIAS:         ${{ steps.signing.outputs.alias }}
          KEY_PASSWORD:      ${{ steps.signing.outputs.key_pass }}

      - name: Wipe keystore
        if: always()
        run: shred -u client/keystore.jks 2>/dev/null || rm -f client/keystore.jks

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find client/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            find client -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          OUT="wexow-release-v${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT"                              >> $GITHUB_OUTPUT
          echo "size=$(du -h $OUT | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Copy to server directory
        run: cp "${{ steps.apk.outputs.path }}" server/base.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wexow-release-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Upload server base.apk
        uses: actions/upload-artifact@v4
        with:
          name: server-base-apk-v${{ steps.version.outputs.name }}
          path: server/base.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: WexowRAT v${{ steps.version.outputs.name }}
          generate_release_notes: true
