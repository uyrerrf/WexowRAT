name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'client/**'
      - '.github/workflows/build-debug.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            > /dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;30.0.3" \
            "platforms;android-34"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('client/**/*.gradle') }}
          restore-keys: |
            gradle-caches-

      - name: Create local.properties
        working-directory: client
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        working-directory: client
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: client
        run: |
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: apk
        run: |
          APK="client/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            find client -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "size=$(du -h $APK | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Copy to server directory
        run: cp client/app/build/outputs/apk/debug/app-debug.apk server/base.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wexow-debug-${{ github.sha }}
          path: client/app/build/outputs/apk/debug/app-debug.apk
