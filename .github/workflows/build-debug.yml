name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'client/**'
      - '.github/workflows/build-debug.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install required SDK components
        run: |
          sdkmanager "build-tools;30.0.3" "platforms;android-34" --sdk_root=$ANDROID_HOME

      - name: Create local.properties
        working-directory: client
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('client/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('client/**/*.gradle') }}-${{ hashFiles('client/**/*.gradle.kts') }}
          restore-keys: |
            gradle-caches-

      - name: Make gradlew executable
        working-directory: client
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: client
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK exists
        working-directory: client
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found at expected path"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "APK_PATH=$(realpath $APK)" >> $GITHUB_ENV
          echo "APK_SIZE=$(du -h $APK | awk '{print $1}')" >> $GITHUB_ENV
          echo "APK found: $APK ($(du -h $APK | awk '{print $1}'))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wexow-debug-${{ github.sha }}
          path: client/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to server directory
        run: cp client/app/build/outputs/apk/debug/app-debug.apk server/base.apk

      - name: Upload server base.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-base-apk-${{ github.sha }}
          path: server/base.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | debug |" >> $GITHUB_STEP_SUMMARY
          
