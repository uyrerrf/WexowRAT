name: Generate Signing Keystore

# Run this ONCE to create a keystore and print the secrets you need to
# add to Settings → Secrets → Actions in your GitHub repository.
# After capturing the output, delete the run logs.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias name'
        required: true
        default: 'wexow'
      distinguished_name:
        description: 'Distinguished name (CN=..., OU=..., O=..., L=..., ST=..., C=..)'
        required: true
        default: 'CN=Wexow, OU=Dev, O=Wexow, L=Unknown, ST=Unknown, C=US'
      validity_days:
        description: 'Validity in days'
        required: true
        default: '10000'

jobs:
  generate:
    name: Generate keystore + print secrets
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate random passwords
        id: passwords
        run: |
          KS_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9!@#$%' | head -c 24)
          KEY_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9!@#$%' | head -c 24)
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "ks_pass=$KS_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 4096 \
            -validity ${{ github.event.inputs.validity_days }} \
            -alias "${{ github.event.inputs.key_alias }}" \
            -dname "${{ github.event.inputs.distinguished_name }}" \
            -storepass "${{ steps.passwords.outputs.ks_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -v

      - name: Encode and print secrets
        run: |
          B64=$(base64 -w 0 release.jks)
          echo ""
          echo "=========================================="
          echo "  ADD THESE TO YOUR REPOSITORY SECRETS"
          echo "=========================================="
          echo ""
          echo "Secret name : KEYSTORE_BASE64"
          echo "Secret value: $B64"
          echo ""
          echo "Secret name : KEYSTORE_PASSWORD"
          echo "Secret value: ${{ steps.passwords.outputs.ks_pass }}"
          echo ""
          echo "Secret name : KEY_ALIAS"
          echo "Secret value: ${{ github.event.inputs.key_alias }}"
          echo ""
          echo "Secret name : KEY_PASSWORD"
          echo "Secret value: ${{ steps.passwords.outputs.key_pass }}"
          echo ""
          echo "=========================================="
          echo "  DELETE THESE RUN LOGS AFTER COPYING"
          echo "=========================================="

      - name: Wipe keystore file
        if: always()
        run: |
          shred -u release.jks 2>/dev/null || rm -f release.jks
          
